---
name: Molecule

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: 'ialejandro.harbor'

jobs:
  molecule:
    name: Molecule - ${{ matrix.distro }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        distro:
          - amazonlinux2023
          - debian12
          - ubuntu2204
          - ubuntu2404
          - rockylinux9

    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: 'ialejandro.harbor'

      - name: Set up Python3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13' # Can't go to 3.14+ until Ansible 13.x

      - name: Install dependencies
        run: pip3 install ansible molecule molecule-plugins[docker]

      - name: Run Molecule tests
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
